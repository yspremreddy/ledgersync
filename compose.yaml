name: ledgersync

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: ledgersync_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only}
      POSTGRES_DB: postgres
      CDC_PASSWORD: ${CDC_PASSWORD:-local-cdc-only}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=2
      - -c
      - max_wal_senders=2
      - -c
      - max_slot_wal_keep_size=256MB
      - -c
      - max_wal_size=256MB
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    mem_limit: 448m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgersync_admin -d postgres && psql -U ledgersync_admin -d postgres -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  kafka-storage-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /var/lib/kafka/data"]
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 64m
    logging: *logging

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "2"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "16777216"
      KAFKA_LOG_SEGMENT_BYTES: "8388608"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    depends_on:
      kafka-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19092:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms16m -Xmx96m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 40s
    logging: *logging

  connect:
    image: quay.io/debezium/connect:3.0.0.Final
    entrypoint: ["/kafka/bin/connect-distributed.sh"]
    command: ["/kafka/config/ledgersync.properties"]
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - ./infra/debezium/worker.properties:/kafka/config/ledgersync.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8083"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 5 http://localhost:8083/connectors >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    logging: *logging

  app:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONNECT_URL: http://connect:8083
      CDC_PASSWORD: ${CDC_PASSWORD:-local-cdc-only}
    mem_limit: 128m
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  postgres_data:
  kafka_data:
